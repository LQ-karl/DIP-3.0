[pytest]
# 将仓库根目录加入导入路径，使 `from src import ...` 在非安装环境下可用
pythonpath = .
# 仅收集 tests 目录
testpaths = tests
# 默认选项：
#   -q           简洁输出
#   将 PytestReturnNotNone 升级为错误，防止测试再次退化成 `return` 假通过
#   说明：test_gui*.py 现已改为带真实 assert 的 pytest 用例（显示相关用例用
#   pytest.importorskip("tkinter") + 无显示时 pytest.skip 守卫），统一纳入本套件运行。
addopts = -q
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
