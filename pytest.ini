[pytest]
# 将仓库根目录加入导入路径，使 `from src import ...` 在非安装环境下可用
pythonpath = .
# 仅收集 tests 目录
testpaths = tests
# 默认选项：
#   -q           简洁输出
#   -k "not gui" 排除需要图形界面/显示环境的 GUI 测试（test_gui*.py）
#   将 PytestReturnNotNone 升级为错误，防止测试再次退化成 `return` 假通过
addopts = -q -k "not gui"
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
